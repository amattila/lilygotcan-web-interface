; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = Web interface for Huebner inverter
default_envs = release
src_dir = src
data_dir = data

[env]
platform = espressif32
framework = arduino
platform_packages = platformio/tool-esptoolpy
board = esp32dev
board_build.filesystem = spiffs
board_build.flash_mode = dio
build_src_filter = +<*> -<.git/> -<.svn/> -<src/flashloader>
upload_port = /dev/cu.usbserial-58EF0761921
upload_speed = 460800
monitor_speed = 115200


[env:release]
build_flags =
	${env.build_flags}
	-D RELEASE
	-I /Users/antti/.platformio/packages/framework-arduinoespressif32/libraries/SPI/src
build_type = release
lib_deps =
	fbiego/ESP32Time@^2.0.0
	adafruit/RTClib@^2.1.1
	bblanchon/ArduinoJson@^6.21.2
	bblanchon/StreamUtils@^1.7.3

[env:debug]
build_flags =
	${env.build_flags}
	-D DEBUG
	-DDEBUG_ESP_PORT=Serial
	-DDEBUG_ESP_CORE
	-DDEBUG_ESP_WIFI
	-I /Users/antti/.platformio/packages/framework-arduinoespressif32/libraries/SPI/src
build_type = debug
lib_deps =
	fbiego/ESP32Time@^2.0.0
	adafruit/RTClib@^2.1.1
	bblanchon/ArduinoJson@^6.21.2
	bblanchon/StreamUtils@^1.7.3
