; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = Web interface for Huebner inverter
default_envs = release
src_dir = src
data_dir = data
extra_configs = platformio-local-override.ini
cache_dir = .pio/cache

[env]
platform = espressif32
framework = arduino
platform_packages = platformio/tool-esptoolpy

; Board configuration - optimized for Lilygo T-CAN485
; For Lilygo T-CAN485: CAN_TX=GPIO27, CAN_RX=GPIO26, WS2812B=GPIO4 (FastLED asynchronous)
; LED colors: Green=init, Blue=CAN, White=web, Red=error (all 100ms auto-off), Off=idle (non-blocking)
board = esp32dev
board_build.filesystem = spiffs
board_build.flash_mode = dio
build_src_filter = +<*> -<.git/> -<.svn/>
upload_speed = 460800
monitor_speed = 115200


[env:release]
build_flags =
	${env.build_flags}
	-D RELEASE
	-Os
	-D FASTLED_FORCE_SOFTWARE_SPI
	-D FASTLED_FORCE_SOFTWARE_PINS
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SPI/src

build_type = release
lib_deps =
	fbiego/ESP32Time@^2.0.0
	adafruit/RTClib@^2.1.1
	adafruit/Adafruit BusIO@^1.14.1
	bblanchon/ArduinoJson@^7.0.0
	bblanchon/StreamUtils@^1.9.0
	fastled/FastLED@^3.7.0

[env:debug]
build_flags =
	${env.build_flags}
	-D DEBUG
	-DDEBUG_ESP_PORT=Serial
	-DDEBUG_ESP_CORE
	-DDEBUG_ESP_WIFI
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SPI/src
build_type = debug
lib_deps =
	fbiego/ESP32Time@^2.0.0
	adafruit/RTClib@^2.1.1
	adafruit/Adafruit BusIO@^1.14.1
	bblanchon/ArduinoJson@^6.21.2
	bblanchon/StreamUtils@^1.7.3
	fastled/FastLED@^3.7.0
